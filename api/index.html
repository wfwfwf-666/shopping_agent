<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>购物决策助手</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:#212121; color:#ececec;
         font:15px/1.75 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }

  .app { display:flex; height:100vh; overflow:hidden; }

  /* ---------- 侧边栏 ---------- */
  aside { width:260px; flex:0 0 260px; background:#171717; border-right:1px solid #2a2a2a;
          display:flex; flex-direction:column; padding:14px 10px; }
  .brand { font-weight:700; font-size:15px; padding:6px 10px 14px; letter-spacing:.3px; }
  .new-btn { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px;
             background:#2b2b2b; border:1px solid #3a3a3a; color:#ececec; cursor:pointer;
             font-size:14px; text-align:left; }
  .new-btn:hover { background:#333; }
  .new-btn span { font-size:16px; line-height:1; }
  .sess-title { margin:18px 10px 8px; font-size:12px; color:#7a7a7a; }
  .sessions { flex:1; overflow-y:auto; }
  .sess { display:flex; align-items:center; justify-content:space-between; gap:8px;
          padding:9px 10px; border-radius:10px; color:#c9c9c9; cursor:pointer; font-size:14px; }
  .sess:hover { background:#242424; }
  .sess.active { background:#2f2f2f; color:#fff; }
  .sess .txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sess .x { opacity:0; border:0; background:transparent; color:#888; cursor:pointer; font-size:14px; }
  .sess:hover .x { opacity:1; }
  .sess .x:hover { color:#ff6b6b; }
  .side-foot { padding:10px; font-size:12px; color:#666; border-top:1px solid #262626; }

  /* ---------- 主区 ---------- */
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .top { height:52px; flex:0 0 52px; display:flex; align-items:center; justify-content:space-between;
         padding:0 22px; border-bottom:1px solid #2a2a2a; font-size:14px; color:#bdbdbd; }
  .top .name { color:#ececec; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .messages { flex:1; overflow-y:auto; }
  .inner { max-width:760px; margin:0 auto; padding:28px 22px 40px; }

  .empty { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
           gap:10px; color:#8a8a8a; }
  .empty h1 { font-size:22px; color:#ececec; margin:0; font-weight:600; }
  .empty p { margin:0; font-size:14px; }

  .msg { margin:26px 0; }
  .msg.user { display:flex; justify-content:flex-end; }
  .msg.user .bubble { background:#2f2f2f; padding:10px 16px; border-radius:16px; max-width:80%;
                      white-space:pre-wrap; word-break:break-word; }
  .ai .answer { white-space:pre-wrap; word-break:break-word; }
  .ai .answer b { color:#fff; }
  .ai code { background:#2a2a2a; padding:1px 5px; border-radius:4px; font-size:13px; }

  .steps { margin:12px 0 0; padding:0; list-style:none; color:#9b9b9b; font-size:13px; }
  .steps li { padding:1px 0; }
  .steps li::before { content:"✓ "; color:#5cb85c; }
  .steps.busy li:last-child::before { content:"… "; color:#8ab4f8; }

  /* ---------- 输入区 ---------- */
  .composer { flex:0 0 auto; padding:14px 22px 22px; }
  .box { max-width:760px; margin:0 auto; display:flex; align-items:center; gap:8px;
         background:#2f2f2f; border:1px solid #3a3a3a; border-radius:26px; padding:8px 8px 8px 18px; }
  .box:focus-within { border-color:#555; }
  input { flex:1; background:transparent; border:0; outline:0; color:#ececec; font-size:15px; }
  .send { width:36px; height:36px; flex:0 0 36px; border-radius:50%; border:0; background:#ececec;
          color:#212121; font-size:17px; cursor:pointer; line-height:1; }
  .send:disabled { opacity:.35; cursor:default; }
  .hint { max-width:760px; margin:8px auto 0; font-size:12px; color:#666; text-align:center; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">购物决策助手</div>
    <button class="new-btn" id="newBtn"><span>＋</span> 新建会话</button>
    <div class="sess-title">最近会话</div>
    <div class="sessions" id="sessions"></div>
    <div class="side-foot">多智能体 · LangGraph</div>
  </aside>

  <main>
    <div class="top">
      <div class="name" id="topName">新会话</div>
      <div>Demo</div>
    </div>

    <div class="messages" id="scroll">
      <div class="inner" id="list">
        <div class="empty" id="empty">
          <h1>今天想买点什么？</h1>
          <p>说说预算和需求，我来帮你挑。</p>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="box">
        <input id="q" placeholder="例如：8000 以内帮我挑一台手机" autocomplete="off">
        <button class="send" id="send">↑</button>
      </div>
      <div class="hint">Enter 发送</div>
    </div>
  </main>
</div>

<script>
const KEY = 'shop_agent_sessions';
const listEl = document.getElementById('list');
const scrollEl = document.getElementById('scroll');
const emptyEl = document.getElementById('empty');
const sessionsEl = document.getElementById('sessions');
const topName = document.getElementById('topName');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');

let sessions = JSON.parse(localStorage.getItem(KEY) || '[]');
let current = null;

function saveSessions(){ localStorage.setItem(KEY, JSON.stringify(sessions)); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
}
function scrollBottom(){ scrollEl.scrollTop = scrollEl.scrollHeight; }

function renderSessions(){
  sessionsEl.innerHTML = '';
  sessions.forEach(s => {
    const d = document.createElement('div');
    d.className = 'sess' + (s.id === current ? ' active' : '');
    d.innerHTML = '<span class="txt">' + esc(s.title || '新会话') + '</span><button class="x">×</button>';
    d.onclick = (e) => {
      if (e.target.classList.contains('x')) { removeSession(s.id); return; }
      switchSession(s.id);
    };
    sessionsEl.appendChild(d);
  });
}

function newSession(){
  const s = { id: 's' + Date.now(), title: '新会话' };
  sessions.unshift(s);
  current = s.id;
  saveSessions(); renderSessions();
  listEl.innerHTML = '';
  listEl.appendChild(emptyEl);
  emptyEl.style.display = '';
  topName.textContent = '新会话';
  input.focus();
}

async function removeSession(id){
  sessions = sessions.filter(s => s.id !== id);
  saveSessions();
  if (current === id) { current = null; newSession(); }
  else renderSessions();
}

async function switchSession(id){
  current = id;
  const s = sessions.find(x => x.id === id);
  topName.textContent = (s && s.title) || '新会话';
  renderSessions();

  listEl.innerHTML = '';
  const resp = await fetch('/api/history/' + id);
  const items = await resp.json();
  if (!items.length) {
    listEl.appendChild(emptyEl); emptyEl.style.display = '';
    return;
  }
  emptyEl.style.display = 'none';
  items.forEach(it => addMessage(it.role, it.content));
  scrollBottom();
}

function addMessage(role, content){
  if (emptyEl.parentNode === listEl) emptyEl.style.display = 'none';
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  if (role === 'user') {
    d.innerHTML = '<div class="bubble">' + esc(content) + '</div>';
  } else {
    d.innerHTML = '<div class="answer">' + md(content) + '</div>';
  }
  listEl.appendChild(d);
  return d;
}

function addAssistantShell(){
  const d = document.createElement('div');
  d.className = 'msg ai';
  d.innerHTML = '<div class="answer">思考中…</div><ul class="steps busy"></ul>';
  listEl.appendChild(d);
  return { root: d, answer: d.querySelector('.answer'), steps: d.querySelector('.steps') };
}

async function send(){
  const text = input.value.trim();
  if (!text) return;
  if (!current) newSession();

  input.value = '';
  sendBtn.disabled = true;
  emptyEl.style.display = 'none';

  addMessage('user', text);
  scrollBottom();

  const ui = addAssistantShell();
  const steps = [];
  let first = true;

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ session_id: current, message: text })
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });

      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const line = raw.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;

        let ev;
        try { ev = JSON.parse(line.slice(6)); } catch (e) { continue; }

        if (ev.type === 'step') {
          steps.push(ev);
          ui.steps.innerHTML = steps.map(s =>
            '<li>' + esc(s.label) + (s.detail ? ' · ' + esc(s.detail) : '') + '</li>'
          ).join('');
          const t = ui.answer.textContent;
          if (t === '思考中…' || t === '') ui.answer.textContent = '';
          scrollBottom();
        } else if (ev.type === 'answer') {
          ui.answer.innerHTML = md(ev.content);
          ui.steps.classList.remove('busy');
          if (first) {
            const s = sessions.find(x => x.id === current);
            if (s && s.title === '新会话') {
              s.title = text.slice(0, 16) + (text.length > 16 ? '…' : '');
              saveSessions(); renderSessions();
              topName.textContent = s.title;
            }
            first = false;
          }
          scrollBottom();
        } else if (ev.type === 'error') {
          ui.answer.innerHTML = '<span style="color:#ff6b6b">出错了：' + esc(ev.content) + '</span>';
        }
      }
    }
  } catch (e) {
    ui.answer.innerHTML = '<span style="color:#ff6b6b">网络错误：' + esc(e.message) + '</span>';
  }

  sendBtn.disabled = false;
  input.focus();
}

document.getElementById('newBtn').onclick = newSession;
sendBtn.onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// 启动
if (!sessions.length) newSession();
else { current = sessions[0].id; switchSession(current); }
renderSessions();
</script>
</body>
</html>
